# Example configuration for the made-up applicant.

targets:
  roles: [swe, quant]            # shown first; other roles are flagged as adjacent
  term:
    earliest_start: "2027-05-15"
    latest_end: "2027-08-31"
  regions: [north-america, europe]
  working_language: english
  work_mode_preference: [onsite, hybrid, remote]   # most to least preferred

applicant:
  degree: bachelor               # bachelor, master, or phd; other levels are filtered out
  year_of_study: 3               # optional: your current year of study
  graduation: "2028-04"          # optional: expected graduation; postings wanting another window are flagged

ingest:
  max_age_days: 60               # for sources that never mark roles closed
  missing_syncs_to_close: 2

# Used until you add or change a source on the Sources page. From then on the
# app keeps the list in sources.yaml next to this file.
sources:
  - repo: example-org/example-internships
    branch: main
    path: README.md
    parser: markdown-table       # json, yaml-folder, or markdown-table

llm:
  reading_model: claude-haiku-5-5    # reads job postings; the small, cheap model is enough
  writing_model: claude-opus-5-5     # writes resumes and cover letters
  read_ahead: 10                     # how many jobs at the front of the queue are read ahead of you
  refresh_days: 4                    # fetch a posting again after this many days, to notice it closed

resume:
  style: navy                        # navy, classic, or a folder in resume/styles/
  # options: {accent: "1F3A5F", font_size: 10, margin: 0.5, bold_highlights: true}
  projects_title: Projects

tracking:
  weekly_goal: 30                    # applications you aim to send each week
  quiet_after_days: 14               # remind you about an application with no news this long; 0 = off
  deadline_within_days: 5            # remind you about queued jobs whose deadline is this close; 0 = off
  sync_every_hours: 6                # sync sources this often while the app is running; 0 = off

guard:
  # Extra strings the commit guard should refuse, beyond name, email, and phone.
  extra_terms:
    - alexdoe-example
